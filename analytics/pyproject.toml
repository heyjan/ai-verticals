[project]
name = "ai-job-analytics"
version = "0.1.0"
description = "Authenticated dashboard data-chat agent for the AI jobs dataset."
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg==0.31.0",
    "fastapi==0.139.0",
    "pydantic-ai-slim[openai,ui]==2.6.0",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
