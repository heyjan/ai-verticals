services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobs}
      POSTGRES_DB: ${POSTGRES_DB:-jobs}
      # Use a subdirectory inside the mounted volume for the actual data
      # cluster. Rootless podman creates named-volume mountpoints owned by
      # host root, so postgres-user (UID 70 inside the container) can't
      # chmod the root of the mount. Pointing PGDATA at a child path lets
      # the entrypoint mkdir + chmod a fresh subdir it owns. Portable to
      # Docker (no-op there since Docker handles volume ownership).
      PGDATA: /var/lib/postgresql/data/pgdata
    # Bind to loopback only: every service reaches Postgres over the compose
    # network (host `postgres`), so the port never needs to be on a public
    # interface. Publishing to 127.0.0.1 keeps same-host tooling working
    # (drizzle-kit studio/push, ad-hoc psql) without exposing the DB to the
    # outside. Override POSTGRES_BIND=0.0.0.0 only if a remote host must connect.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jobs}:${POSTGRES_PASSWORD:-jobs}@postgres:5432/${POSTGRES_DB:-jobs}
      CHAT_RO_PASSWORD: ${CHAT_RO_PASSWORD}
      SEED_DB_PATH: /app/data/seed/jobs.db
    # No bind mount: the seed image bakes in data/seed/jobs.db so a
    # remote deploy bootstraps without any host mount. A bind mount
    # here would shadow that file and trip SELinux on Fedora/podman.
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    environment:
      CHAT_DATABASE_URL: postgres://chat_ro:${CHAT_RO_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobs}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jobs}:${POSTGRES_PASSWORD:-jobs}@postgres:5432/${POSTGRES_DB:-jobs}
      NUXT_ANALYTICS_URL: http://analytics:8000
      HOST: 0.0.0.0
      # Auth (nuxt-auth-utils). Values come from the gitignored root .env.
      # Public origin is https so the OAuth redirect + secure session cookie
      # resolve correctly behind Traefik.
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_OAUTH_GITHUB_CLIENT_ID: ${NUXT_OAUTH_GITHUB_CLIENT_ID:-}
      NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${NUXT_OAUTH_GITHUB_CLIENT_SECRET:-}
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      NUXT_OAUTH_X_CLIENT_ID: ${NUXT_OAUTH_X_CLIENT_ID:-}
      NUXT_OAUTH_X_CLIENT_SECRET: ${NUXT_OAUTH_X_CLIENT_SECRET:-}
      NUXT_OAUTH_LINKEDIN_CLIENT_ID: ${NUXT_OAUTH_LINKEDIN_CLIENT_ID:-}
      NUXT_OAUTH_LINKEDIN_CLIENT_SECRET: ${NUXT_OAUTH_LINKEDIN_CLIENT_SECRET:-}
      NUXT_CV_BUILDER_ADMIN_ONLY: ${NUXT_CV_BUILDER_ADMIN_ONLY:-true}
      NUXT_CV_BUILDER_STORAGE_ROOT: ${NUXT_CV_BUILDER_STORAGE_ROOT:-/app/.data/cv-builder}
    volumes:
      # Private server-side CV uploads/exports. Files are only exposed through
      # authenticated Nitro routes that check user ownership.
      - cv-builder-data:/app/.data/cv-builder
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      analytics:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.aiverticals.rule=Host(`ai-verticals.dev`) || Host(`www.ai-verticals.dev`)
      - traefik.http.routers.aiverticals.entrypoints=websecure
      - traefik.http.routers.aiverticals.tls.certresolver=letsencrypt
      - traefik.http.services.aiverticals.loadbalancer.server.port=3000
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true

volumes:
  pg-data:
  cv-builder-data:
